<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <main id="box-main">
        <div class="background-catalogo">
    <header class="navigation">
        <nav class="head">
            <div class="cabecalho1">
                <img src="img/category.png" alt="icone de categoria">
            <p class="cabecalho">Catalog</p>
            </div>
            <p class="cabecalho">About us</p>
            <p class="cabecalho">Contacts</p>
            <div class="cabecalho2">
                <img src="img/3d-shapes.png" alt="icone de formas 3d">
            </div>
            <p class="cabecalho">Favorites</p>
            <p class="cabecalho">Search</p>
            <div class="cabecalho3">
                <img src="img/shopping-bag.png" alt="icone de sacola de compras">
            <p class="cabecalho">$2.517</p>
            </div>
        </nav>
        <div class="topo"><img src="img/explosion.png" alt="icone de estrela" class="star">
            <span class="free">FREE</span>
            </div>
    </header>
    <section class="corpo">
        <h1>Premium forniture from the manufacturer <span class="marca">B.BRAND</span> at reasonable prices</h1>
        <div class="icone">
            <div class="botao">
            <icon><i class="bi bi-play-circle"></i></icon>
        </div>
            <p>watch company presentation</p>
        </div>

        <div class="filtros">
        <div class="frase"><p>Price $500-$700</p></div>
        <div class="frase"><p>Category Chairs/armchairs</p></div>
        <div class="frase"><p>Color: Any</p></div>
        
        <div class="galeria">
            <figure class="item1"><img src="img/blank-picture-frame-by-pink-velvet-armchair.jpg" alt="Imagem de uma cadeira rosa">
                <figcaption>Armchair Boho $800</figcaption>
            </figure>
            <figure class="item2"><img src="img/download.jpeg" alt="Imagem de uma poltrona rosa">
                <figcaption>Classic $700</figcaption>
            </figure>
            <figure class="item3"><img src="img/pink-armchair-modern-living-room_23-2151988662.avif" alt="imagem de uma cadeira rosa co madeira">
               <figcaption>Armchair Modern $600</figcaption> 
            </figure>
            </div>
        </div>
    </section>
    </div>
    </main>
</body>
</html>
