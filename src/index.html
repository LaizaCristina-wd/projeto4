<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
     <header class="site-header">
         
        <nav>
            <ul class="menu">
                <li>
                <img src="img/category.png" alt="icone de categoria">
            <a href="#">Catalog</a>
            </li>
            <li><a href="#">About us</a></li>
            <li><a href="#">Contacts</a></li>
            <li>
                <img src="img/3d-shapes.png" alt="icone de formas 3d">
            </li>
            <li><a href="#">Favorites</a></li>
            <li><a href="#">Search</a></li>
            <li>
                <img src="img/shopping-bag.png" alt="icone de sacola de compras">

            </li>
            </ul>
        </nav>
        <div class="icon-free"><img src="img/explosion.png" alt="icone de estrela" class="star">
            <span class="free">FREE</span>
         </div>
    </header>

    <main class="background-catalogo">
     <section class="hero">
        <h1>Premium forniture from the manufacturer <span class="brand">B.BRAND</span> at reasonable prices</h1>
        <button class="button-presentation">
            <icon><i class="bi bi-play-circle"></i></icon>
            <p>watch company presentation</p>
        </button>
     </section>

     <section class="filters">
        <ul>
        <li>Price $500-$700</li>
        <li>Category Chairs/armchairs</li>
        <li>Color: Any</li>
        </ul>
     </section>

     <section class="products">
            <figure><img src="img/blank-picture-frame-by-pink-velvet-armchair.jpg" alt="Imagem de uma cadeira rosa">
                <h2>Armchair Boho $800</h2>
            </figure>
            <figure><img src="img/download.jpeg" alt="Imagem de uma poltrona rosa">
                <h2>Classic $700</h2>
            </figure>
            <figure>
                <img src="img/pink-armchair-modern-living-room_23-2151988662.avif" alt="imagem de uma cadeira rosa co madeira">
               <h2>Armchair Modern $600</h2> 
            </figure>
        
        </section>
    </main>
    <footer> <p> &copy; 2026 B.BRAND. All rights reserved.</p></footer>
